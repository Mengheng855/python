<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you love me?</title>
  <style>
    body {
      text-align: center;
      background-color: #ffe6f2;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    img {
      margin-top: 50px;
    }
    h1 {
      color: #ff0066;
      font-size: 2rem;
    }
    .btn {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
     
    }
    #yes {
      background-color: #4CAF50;
      color: white;
    }
    #no {
      background-color: #f44336;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>
  <img src="https://i.pinimg.com/originals/49/af/20/49af2056717bdc97ea295b1329ad294b.gif" width="200px" height="200px" alt="">
  <h1>Do you love me?</h1>

  <div  style="margin-right: 100px;">
    <button id="yes" class="btn">Yes ❤️</button>
    <button id="no" class="btn">No 💔</button>
  </div>

  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = `
        <h1 style="color:#ff0066;">Yay! ❤️ I love you too!</h1>
        <img src="https://i.pinimg.com/originals/70/79/14/7079144f393c8a4d32f97a3ab2d744e5.gif" width="250px">
      `;
    });
  </script>
</body>
</html>
