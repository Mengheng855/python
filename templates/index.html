{% extends "base.html" %}

{% block title %}
<title>Flask</title>
{% endblock %}

{% block content %}
<div class="container mt-4 p-5 shadow">
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <!-- Button trigger modal -->
    <button type="button" id="add" class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#exampleModal">
        +Add user
    </button>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Profile</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.name }}</td>
                <td>{{ u.email }}</td>
                <td><img src="{{ u.profile }}" width="60px" height="60px" class="rounded-circle" alt="Profile Image"></td>
                <td>
                    <button id="edit" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#exampleModal">Edit</button>
                    <a href="/delete/{{ u.id }}" class="btn btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Add user</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="/" method="post" id="form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="profile">Profile</label>
                        <input type="file" name="profile" id="profile" class="form-control" accept="image/*">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" id="btnEdit" class="btn btn-warning" style="display: none;">Edit</button>
                        <button type="submit" id="btnAdd" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('#add').click(function(){
            $('#btnEdit').hide();
            $('#btnAdd').show();
            $('#exampleModalLabel').text('Add user');
            $('#form')[0].reset();
            $('#form').attr('action', '/');
        });
        $(document).on('click', '#edit', function(){
            $('#btnEdit').show();
            $('#btnAdd').hide();
            $('#exampleModalLabel').text('Edit user');
            const row = $(this).closest('tr');
            const id = row.find('td:eq(0)').text().trim();
            const name = row.find('td:eq(1)').text().trim();
            const email = row.find('td:eq(2)').text().trim();

            $('#name').val(name);
            $('#email').val(email);
            $('#form').attr('action', `/edit/${id}`);
        });
        $('#form').submit(function(e){
            console.log('Form submitted');
            console.log('Name:', $('#name').val());
            console.log('Email:', $('#email').val());
            console.log('Profile file:', $('#profile').val());
        });
    });
</script>
{% endblock %}
